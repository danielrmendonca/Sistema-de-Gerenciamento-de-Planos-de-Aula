# ----------NGINX QUE SERVE O SPA DO FRONTEND----------
# Este nginx fica DENTRO do container do frontend e atende apenas o SPA.
# O proxy reverso (que roteia /api para o backend) e outro container separado
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # try_files garante que rotas client-side do React Router funcionem em refresh.
    # Sem isso, /planos/5/editar daria 404 ao recarregar a pagina
    location / {
        try_files $uri $uri/ /index.html;
    }
}
