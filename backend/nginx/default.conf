# ----------PROXY REVERSO----------
# Esta e a unica porta exposta na maquina hospedeira. Tudo passa por aqui:
# /api/* e /health vao para o backend, qualquer outra rota vai para o frontend
server {
    listen 80;
    server_name _;

    # ----------API----------
    # Encaminha tudo abaixo de /api para o backend Node mantendo o caminho original.
    # Os headers ajudam o backend a registrar o IP real e a origem corretos
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------HEALTH CHECK----------
    # Endpoint separado fora de /api pois o backend expoe diretamente em /health
    location /health {
        proxy_pass http://backend:3000/health;
        proxy_set_header Host $host;
    }

    # ----------SPA----------
    # Tudo o que nao for /api ou /health vai para o nginx do frontend,
    # que serve o build estatico do Vite e cai para index.html nas rotas client-side
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
